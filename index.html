<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard Cocotani Hidroponik</title>
  <style>
    :root {
      --latar: #000000;
      --garis: #1d2a1b;
      --teks: #e6eee3;
      --teks-redup: #8fa08b;
      --hijau: #86c440;
      --tinggi-bar: 52px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--latar);
      color: var(--teks);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .bar {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--tinggi-bar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--garis);
      background: var(--latar);
      z-index: 2;
    }

    .judul {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .judul span {
      color: var(--teks-redup);
      font-weight: 400;
    }

    .aksi {
      display: flex;
      gap: 8px;
      flex: none;
    }

    .tombol {
      flex: none;
      padding: 8px 14px;
      border: 1px solid var(--hijau);
      border-radius: 6px;
      color: var(--hijau);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
    }

    .tombol:hover { background: var(--hijau); color: #000; }
    .tombol:focus-visible { outline: 2px solid var(--teks); outline-offset: 2px; }

    .panggung {
      position: fixed;
      inset: var(--tinggi-bar) 0 0 0;
    }

    /* Teks di bawah iframe: terlihat hanya kalau dashboard belum tampil. */
    .bantuan {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 6px;
      padding: 24px;
      text-align: center;
      color: var(--teks-redup);
      line-height: 1.5;
    }

    .bantuan strong { color: var(--teks); font-weight: 600; }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 480px) {
      .judul span { display: none; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1 class="judul">Cocotani Hidroponik <span>Dashboard</span></h1>
    <div class="aksi">
      <a class="tombol" href="kebun.html">Kebun 3D</a>
      <a class="tombol" id="layar-penuh" target="_blank" rel="noopener"
         href="https://datastudio.google.com/reporting/af1fda7b-3bc9-42cc-8b13-034de4cfee2d/page/HmfZF">Buka layar penuh</a>
    </div>
  </header>

  <main class="panggung">
    <div class="bantuan">
      <strong>Memuat dashboard</strong>
      <span>Kalau tetap kosong, masuk ke Google dengan akun yang punya akses, lalu pilih Buka layar penuh.</span>
    </div>
    <iframe
      title="Dashboard Cocotani Hidroponik"
      src="https://datastudio.google.com/embed/reporting/af1fda7b-3bc9-42cc-8b13-034de4cfee2d/page/HmfZF"
      allowfullscreen
      sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
  </main>
</body>
</html>
